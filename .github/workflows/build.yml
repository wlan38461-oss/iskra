name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iskra-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish result to builds branch
        if: always()
        run: |
          mkdir out
          cp build.log out/ || true
          cp app/build/outputs/apk/release/app-release.apk out/iskra.apk || true
          echo "${GITHUB_SHA}" > out/COMMIT
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

  shots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: iskra-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/shots.sh apk/app-release.apk

      - name: Publish screenshots
        if: always()
        run: |
          mkdir -p shots
          pip install --quiet pillow || true
          python3 .github/scripts/shrink.py shots || true
          echo "${GITHUB_SHA}" > shots/COMMIT
          cd shots
          git init -q -b shots
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "shots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots
