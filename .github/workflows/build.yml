name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iskra-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish result to builds branch
        if: always()
        run: |
          mkdir out
          cp build.log out/ || true
          cp app/build/outputs/apk/release/app-release.apk out/iskra.apk || true
          echo "${GITHUB_SHA}" > out/COMMIT
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
